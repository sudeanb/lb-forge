name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: go vet ./...
      - run: go test ./... -count=1 -timeout 120s

  pages:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: build preview page
        run: |
          mkdir -p public_pages
          cat > public_pages/index.html <<'HTML'
          <!doctype html><meta charset="utf-8"><title>LB Forge</title>
          <style>body{background:#101418;color:#e2e8f0;font-family:monospace;margin:32px;max-width:820px}a{color:#60a5fa}code,pre{color:#a5b6e8}table{border-collapse:collapse}td,th{border:1px solid #333;padding:4px 10px}</style>
          <h1>LB Forge — layer-7 load balancer</h1>
          <p>Static preview; the real balancer runs with
          <code>go run ./cmd/lbforge -strategy least-connections \
          -backends 127.0.0.1:9001,127.0.0.1:9002</code> and serves a live
          panel at <code>/lb/status</code>.</p>
          <h2>Strategies</h2>
          <table><tr><th>strategy</th><th>behaviour</th></tr>
          <tr><td>round-robin</td><td>atomic counter walk</td></tr>
          <tr><td>least-connections</td><td>fewest live proxied connections</td></tr>
          <tr><td>weighted</td><td>smooth weighted round robin (nginx style)</td></tr></table>
          <h2>Circuit breaker</h2>
          <p>2 consecutive failed health probes → <b>open</b> (out of rotation);
          after the probe window a single probe <b>half-opens</b>; success closes,
          failure re-opens. Dial failures retry on a fresh pick before the client
          ever sees a byte.</p>
          HTML
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public_pages
      - id: deployment
        uses: actions/deploy-pages@v4
